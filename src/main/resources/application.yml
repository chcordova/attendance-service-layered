logging:
  level:
    root: INFO
    com.company.attendance: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: 8080

spring:
  application:
    name: attendance-service

# In-Memory H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:attendancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # Hibernate / JPA
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Embedded H2 Console for Debugging
  h2:
    console:
      enabled: true
      path: /h2-console

# Embedded Swagger UI / OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: "Official OpenAPI 3.0.3 Specification"
        url: /openapi.yaml
      - name: "Auto-generated SpringDoc Endpoints"
        url: /v3/api-docs
