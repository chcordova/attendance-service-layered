openapi: 3.0.3
info:
  title: Attendance Service API
  version: 1.0.0
  description: >
    RESTful API for Employee Attendance Management built with Spring Boot 3.3.4,
    Java 21, and Traditional Layered Architecture.
  contact:
    name: Backend Engineering Team
    email: backend-support@company.com

servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Attendance Management
    description: Operations for registering and querying employee attendance events

paths:
  /api/v1/attendances:
    post:
      tags:
        - Attendance Management
      summary: Register employee attendance
      description: >
        Registers a new check-in or check-out attendance record for an employee.
        Accepts both local ISO timestamps (e.g., '2026-09-26T08:30:00') and UTC ISO-8601 strings
        with 'Z' or offset (e.g., '2026-09-27T01:24:12.246Z'). Future dates are strictly prohibited.
      operationId: registerAttendance
      requestBody:
        required: true
        description: Attendance creation payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRequest"
            examples:
              standardCheckIn:
                summary: Standard Check-In Mark
                value:
                  employeeId: 101
                  timestamp: "2026-09-27T01:24:12.246Z"
                  type: "CHECK_IN"
              standardCheckOut:
                summary: Standard Check-Out Mark
                value:
                  employeeId: 101
                  timestamp: "2026-09-27T17:00:00"
                  type: "CHECK_OUT"
      responses:
        "201":
          description: Attendance registered successfully
          headers:
            Location:
              description: URI of the newly created attendance record
              schema:
                type: string
                example: /api/v1/attendances/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
              examples:
                createdResponse:
                  summary: Created Attendance Response
                  value:
                    id: 1
                    employeeId: 101
                    timestamp: "2026-09-27T01:24:12.246"
                    type: "CHECK_IN"
        "400":
          description: Bad Request due to validation, malformed payload, or domain invariant violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                futureDateError:
                  summary: Future date prohibited error
                  value:
                    timestamp: "2026-09-27T11:58:32"
                    status: 400
                    error: "Bad Request"
                    code: "FUTURE_DATE_NOT_ALLOWED"
                    message: "Cannot register an attendance with a future timestamp: 2029-01-01T00:00:00"
                    path: "/api/v1/attendances"
                validationError:
                  summary: Bean validation failure
                  value:
                    timestamp: "2026-09-27T11:58:32"
                    status: 400
                    error: "Bad Request"
                    code: "FIELD_VALIDATION_FAILED"
                    message: "Validation failed for one or more fields."
                    path: "/api/v1/attendances"
                    details:
                      employeeId: "Employee ID must be a positive number."
                      type: "Attendance type is mandatory (CHECK_IN or CHECK_OUT)."
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/attendances/employee/{employeeId}:
    get:
      tags:
        - Attendance Management
      summary: Get employee attendance records
      description: >
        Retrieves a paginated list of attendance records for a specific employee.
        If the employee has no records, returns 200 OK with an empty array, totalElements: 0,
        and totalPages: 0.
      operationId: getAttendancesByEmployee
      parameters:
        - name: employeeId
          in: path
          required: true
          description: Unique positive identifier of the employee
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 101
        - name: page
          in: query
          required: false
          description: Zero-based page index (page >= 0)
          schema:
            type: integer
            default: 0
            minimum: 0
          example: 0
        - name: size
          in: query
          required: false
          description: The size of the page to be returned (1 <= size <= 100)
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          example: 10
      responses:
        "200":
          description: Paginated attendance marks for the given employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAttendanceResponse"
              examples:
                recordsFound:
                  summary: Attendance records found
                  value:
                    content:
                      - id: 2
                        employeeId: 101
                        timestamp: "2026-09-27T17:00:00"
                        type: "CHECK_OUT"
                      - id: 1
                        employeeId: 101
                        timestamp: "2026-09-27T08:30:00"
                        type: "CHECK_IN"
                    page: 0
                    size: 10
                    totalElements: 2
                    totalPages: 1
                    first: true
                    last: true
                noRecordsFound:
                  summary: No records found for employee
                  value:
                    content: []
                    page: 0
                    size: 10
                    totalElements: 0
                    totalPages: 0
                    first: true
                    last: true
        "400":
          description: Invalid employee identifier or pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidEmployeeId:
                  summary: Negative or non-positive employee ID
                  value:
                    timestamp: "2026-09-27T11:58:32"
                    status: 400
                    error: "Bad Request"
                    code: "INVALID_ATTENDANCE_DATA"
                    message: "Invalid attendance data."
                    path: "/api/v1/attendances/employee/-5"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    AttendanceType:
      type: string
      enum:
        - CHECK_IN
        - CHECK_OUT
      description: Type of attendance registration event
      example: CHECK_IN

    AttendanceRequest:
      type: object
      required:
        - employeeId
        - timestamp
        - type
      properties:
        employeeId:
          type: integer
          format: int64
          minimum: 1
          description: Unique identifier of the employee. Must be strictly positive (> 0).
          example: 101
        timestamp:
          type: string
          format: date-time
          description: Attendance date and time in ISO-8601 format. Cannot be in the future.
          example: "2026-09-27T01:24:12.246Z"
        type:
          $ref: "#/components/schemas/AttendanceType"

    AttendanceResponse:
      type: object
      required:
        - id
        - employeeId
        - timestamp
        - type
      properties:
        id:
          type: integer
          format: int64
          description: Auto-generated unique record ID
          example: 1
        employeeId:
          type: integer
          format: int64
          description: Unique identifier of the employee
          example: 101
        timestamp:
          type: string
          format: date-time
          description: Recorded date and time of the attendance
          example: "2026-09-27T01:24:12.246"
        type:
          $ref: "#/components/schemas/AttendanceType"

    PaginatedAttendanceResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
        - first
        - last
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceResponse"
          description: List of attendance records for the requested page
        page:
          type: integer
          description: Current zero-based page number
          example: 0
        size:
          type: integer
          description: Number of records per page
          example: 10
        totalElements:
          type: integer
          format: int64
          description: Total count of records matching the query
          example: 2
        totalPages:
          type: integer
          description: Total count of pages
          example: 1
        first:
          type: boolean
          description: True if this is the first page
          example: true
        last:
          type: boolean
          description: True if this is the last page
          example: true

    ErrorResponse:
      type: object
      required:
        - timestamp
        - status
        - error
        - code
        - message
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: Error occurrence timestamp
          example: "2026-09-27T11:58:32"
        status:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: HTTP status reason phrase
          example: "Bad Request"
        code:
          type: string
          description: Domain or technical error code
          example: "FUTURE_DATE_NOT_ALLOWED"
        message:
          type: string
          description: Human-readable error description
          example: "Cannot register an attendance with a future timestamp."
        path:
          type: string
          description: Request endpoint URI where error occurred
          example: "/api/v1/attendances"
        details:
          type: object
          additionalProperties:
            type: string
          description: Optional map of field-level validation errors
          example:
            employeeId: "Employee ID must be a positive number."
